<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Activar cuenta — Coordinador de Discursos</title>
<link rel="stylesheet" href="css/styles.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--sidebar-bg);padding:20px;box-sizing:border-box;}
.ob-wrap{background:#1e293b;border-radius:20px;max-width:560px;width:100%;border:1px solid rgba(255,255,255,.08);overflow:hidden;}
.ob-header{background:#1a2332;padding:20px 28px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);}
.ob-header h1{color:#fff;font-size:18px;font-weight:600;margin:0 0 4px}
.ob-header p{color:rgba(255,255,255,.5);font-size:13px;margin:0}
.ob-steps{display:flex;padding:16px 28px;border-bottom:1px solid rgba(255,255,255,.08);}
.ob-step{flex:1;text-align:center;position:relative;}
.ob-step:not(:last-child)::after{content:'';position:absolute;top:13px;left:55%;width:90%;height:2px;background:rgba(255,255,255,.1);}
.ob-step.done::after,.ob-step.active::after{background:var(--pr);}
.ob-dot{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);margin:0 auto 5px;position:relative;z-index:1;}
.ob-step.active .ob-dot,.ob-step.done .ob-dot{background:var(--pr);color:#fff;}
.ob-step-lbl{font-size:10px;color:rgba(255,255,255,.4);}
.ob-step.active .ob-step-lbl{color:#fff;}
.ob-body{padding:28px;}
.ob-field{margin-bottom:14px;}
.ob-field label{display:block;font-size:13px;color:rgba(255,255,255,.7);margin-bottom:5px;font-weight:500;}
.ob-field label span{color:#f87171;}
.ob-input{width:100%;padding:10px 13px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(255,255,255,.06);color:#fff;font-size:14px;box-sizing:border-box;}
.ob-input:focus{outline:none;border-color:var(--pr);}
.ob-input::placeholder{color:rgba(255,255,255,.3);}
.ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ob-btn{width:100%;padding:12px;background:var(--pr);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}
.ob-btn:disabled{opacity:.5;cursor:not-allowed;}
.ob-btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);margin-top:6px;}
.ob-err{font-size:12px;color:#f87171;margin-top:6px;min-height:18px;}
.ob-info{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:12px 14px;font-size:13px;color:rgba(255,255,255,.6);margin-bottom:16px;line-height:1.5;}
.ob-info strong{color:#fff;}
.disc-wrap{max-height:300px;overflow-y:auto;border:1px solid rgba(255,255,255,.08);border-radius:9px;margin-bottom:12px;}
.disc-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;}
.disc-item:last-child{border-bottom:none;}
.disc-item:hover{background:rgba(255,255,255,.04);}
.disc-item.sel{background:rgba(58,110,165,.15);}
.disc-num{font-weight:700;font-size:13px;color:var(--pr);min-width:30px;}
.disc-tit{font-size:12px;color:rgba(255,255,255,.7);line-height:1.4;}
.ob-search{width:100%;padding:8px 12px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;font-size:13px;box-sizing:border-box;margin-bottom:8px;}
.ob-search:focus{outline:none;border-color:var(--pr);}
.ob-search::placeholder{color:rgba(255,255,255,.3);}
.ob-count{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:8px;}
.ob-success{text-align:center;padding:40px 28px;}
.ob-success .icon{font-size:52px;margin-bottom:14px;}
.ob-success h2{color:#fff;font-size:20px;margin:0 0 8px;}
.ob-success p{color:rgba(255,255,255,.6);font-size:13px;margin:0 0 20px;line-height:1.6;}
.ob-loading{text-align:center;padding:40px;color:rgba(255,255,255,.6);font-size:14px;}
.pass-hint{font-size:11px;color:rgba(255,255,255,.4);margin-top:3px;}
</style>
</head>
<body>
<div class="ob-wrap" id="ob-wrap">
  <div class="ob-loading">&#128218; Verificando invitacion...</div>
</div>
<script src="js/supabase.min.js"></script>
<script>
var _sb = supabase.createClient(
  'https://drfqhkvppvteqwiycbjd.supabase.co',
  'sb_publishable_hEs_ro07hCvZXLFm_Gq88A_1kvfvqAE'
);

var _inv = null;
var _step = 1;
var _esCongNueva = false;
var _discursos = [];
var _selDiscs = [];
var _datosCong = null;
var _datosUsr = null;

var _token = new URLSearchParams(window.location.search).get('inv');

async function init() {
  if (!_token) { mostrarError('Link invalido. Solicita una nueva invitacion.'); return; }
  var res = await _sb.from('invitaciones').select('*').eq('token', _token).single();
  if (res.error || !res.data) { mostrarError('Invitacion no encontrada o expirada.'); return; }
  var inv = res.data;
  if (inv.usada) { mostrarError('Esta invitacion ya fue utilizada.'); return; }
  if (inv.expira_en && new Date() > new Date(inv.expira_en)) { mostrarError('Esta invitacion ha expirado. Solicita una nueva.'); return; }
  _inv = inv;
  var congRes = await _sb.from('congregaciones').select('*').eq('id', inv.cong_id).single();
  if (congRes.data) {
    var c = congRes.data;
    _esCongNueva = !c.circuito && !c.direccion && !c.horario;
  }
  if (!_esCongNueva) {
    var discRes = await _sb.from('discursos').select('*').eq('cong_id', inv.cong_id).eq('estado', 'Activo').order('numero');
    _discursos = discRes.data || [];
  }
  renderStep();
}

function mostrarError(msg) {
  document.getElementById('ob-wrap').innerHTML =
    '<div style="padding:40px 28px;text-align:center">'
    + '<div style="font-size:44px;margin-bottom:12px">&#9888;</div>'
    + '<h2 style="color:#fff;font-size:17px;margin:0 0 8px">Link invalido</h2>'
    + '<p style="color:rgba(255,255,255,.5);font-size:13px">' + msg + '</p>'
    + '</div>';
}

function totalPasos() {
  return _esCongNueva ? 3 : (_discursos.length > 0 ? 2 : 1);
}

function stepsHTML() {
  var labels = _esCongNueva
    ? ['Congregacion', 'Datos', 'Repertorio']
    : (_discursos.length > 0 ? ['Datos', 'Repertorio'] : ['Datos']);
  var total = labels.length;
  var html = '<div class="ob-steps">';
  for (var i = 0; i < total; i++) {
    var cls = _step > i+1 ? 'done' : _step === i+1 ? 'active' : '';
    var icon = _step > i+1 ? '&#10003;' : String(i+1);
    html += '<div class="ob-step ' + cls + '">'
      + '<div class="ob-dot">' + icon + '</div>'
      + '<div class="ob-step-lbl">' + labels[i] + '</div>'
      + '</div>';
  }
  return html + '</div>';
}

function renderStep() {
  var stepReal = _esCongNueva ? _step : _step + 1;
  var header = '<div class="ob-header">'
    + '<h1>&#128218; Activar tu cuenta</h1>'
    + '<p>Completa los datos para acceder al Coordinador de Discursos</p>'
    + '</div>' + stepsHTML();
  var body = '';

  if (stepReal === 1) {
    body = '<div class="ob-info">Completa los datos de tu congregacion. <strong>Todos los campos son obligatorios.</strong></div>'
      + '<div class="ob-field"><label>Nombre de la congregacion <span>*</span></label><input class="ob-input" id="c-nombre" type="text" placeholder="Ej: Los Arcos"></div>'
      + '<div class="ob-grid">'
      + '<div class="ob-field"><label>Circuito <span>*</span></label><input class="ob-input" id="c-circuito" type="text" placeholder="Ej: RM-13"></div>'
      + '<div class="ob-field"><label>Ciudad <span>*</span></label><input class="ob-input" id="c-ciudad" type="text" placeholder="Santiago"></div>'
      + '</div>'
      + '<div class="ob-field"><label>Direccion del salon <span>*</span></label><input class="ob-input" id="c-dir" type="text" placeholder="Av. Ejemplo 123"></div>'
      + '<div class="ob-grid">'
      + '<div class="ob-field"><label>Dia de reunion <span>*</span></label>'
      + '<select class="ob-input" id="c-dia">'
      + '<option value="">Seleccionar...</option>'
      + '<option value="0">Domingo</option><option value="1">Lunes</option><option value="2">Martes</option>'
      + '<option value="3">Miercoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sabado</option>'
      + '</select></div>'
      + '<div class="ob-field"><label>Horario <span>*</span></label><input class="ob-input" id="c-horario" type="text" placeholder="16:30 hrs"></div>'
      + '</div>'
      + '<div id="ob-err" class="ob-err"></div>'
      + '<button class="ob-btn" onclick="paso1()">Continuar &rarr;</button>';

  } else if (stepReal === 2) {
    body = '<div class="ob-info">Tu email es <strong>' + (_inv.email||'') + '</strong>. Completa tus datos personales.</div>'
      + '<div class="ob-field"><label>Nombre completo <span>*</span></label><input class="ob-input" id="u-nombre" type="text" placeholder="Tu nombre completo" value="' + (_inv.nombre_invitado||'') + '"></div>'
      + '<div class="ob-grid">'
      + '<div class="ob-field"><label>Telefono <span>*</span></label><input class="ob-input" id="u-tel" type="tel" placeholder="+56 9 1234 5678"></div>'
      + '<div class="ob-field"><label>Nombramiento <span>*</span></label>'
      + '<select class="ob-input" id="u-nom">'
      + '<option value="">Seleccionar...</option>'
      + '<option value="Anciano">Anciano</option>'
      + '<option value="Siervo Ministerial">Siervo Ministerial</option>'
      + '<option value="Publicador">Publicador</option>'
      + '</select></div>'
      + '</div>'
      + '<div class="ob-field"><label>Contrasena <span>*</span></label><input class="ob-input" id="u-pass" type="password" placeholder="Minimo 8 caracteres"><div class="pass-hint">Minimo 8 caracteres</div></div>'
      + '<div class="ob-field"><label>Confirmar contrasena <span>*</span></label><input class="ob-input" id="u-pass2" type="password" placeholder="Repite tu contrasena"></div>'
      + '<div id="ob-err" class="ob-err"></div>'
      + '<button class="ob-btn" onclick="paso2()">' + (_discursos.length > 0 ? 'Continuar &rarr;' : 'Activar mi cuenta') + '</button>'
      + (_esCongNueva ? '<button class="ob-btn ob-btn-ghost" onclick="_step--;renderStep()">Volver</button>' : '');

  } else if (stepReal === 3) {
    if (_discursos.length === 0) {
      body = '<div class="ob-info">Tu congregacion no tiene discursos cargados aun. Podras agregar tu repertorio despues de ingresar.</div>'
        + '<button class="ob-btn" onclick="finalizar()">Activar mi cuenta</button>'
        + '<button class="ob-btn ob-btn-ghost" onclick="_step--;renderStep()">Volver</button>';
    } else {
      body = '<div class="ob-info">Selecciona los discursos de tu repertorio. Puedes agregar mas despues de ingresar.</div>'
        + '<input class="ob-search" id="disc-q" placeholder="Buscar por numero o titulo..." oninput="filtrarDiscs()">'
        + '<div class="ob-count" id="disc-cnt">0 seleccionados</div>'
        + '<div class="disc-wrap" id="disc-wrap"></div>'
        + '<div id="ob-err" class="ob-err"></div>'
        + '<button class="ob-btn" style="margin-top:10px" onclick="finalizar()">Activar mi cuenta</button>'
        + '<button class="ob-btn ob-btn-ghost" onclick="_step--;renderStep()">Volver</button>';
    }
  }

  document.getElementById('ob-wrap').innerHTML = header + '<div class="ob-body">' + body + '</div>';
  if (stepReal === 3 && _discursos.length > 0) filtrarDiscs();
}

function obErr(msg) {
  var el = document.getElementById('ob-err');
  if (el) el.textContent = msg || '';
}

function filtrarDiscs() {
  var q = (document.getElementById('disc-q').value || '').toLowerCase();
  var wrap = document.getElementById('disc-wrap');
  if (!wrap) return;
  var lista = q ? _discursos.filter(function(d) {
    return String(d.numero).includes(q) || (d.titulo||'').toLowerCase().includes(q);
  }) : _discursos;
  wrap.innerHTML = lista.map(function(d) {
    var sel = _selDiscs.indexOf(d.numero) >= 0;
    return '<div class="disc-item' + (sel ? ' sel' : '') + '" data-num="' + d.numero + '">'
      + '<input type="checkbox"' + (sel ? ' checked' : '') + '>'
      + '<span class="disc-num">' + d.numero + '</span>'
      + '<span class="disc-tit">' + (d.titulo||'') + '</span>'
      + '</div>';
  }).join('');
  wrap.querySelectorAll('.disc-item').forEach(function(el) {
    el.addEventListener('click', function() {
      var num = parseInt(el.dataset.num);
      var idx = _selDiscs.indexOf(num);
      if (idx >= 0) _selDiscs.splice(idx, 1); else _selDiscs.push(num);
      filtrarDiscs();
    });
  });
  var cnt = document.getElementById('disc-cnt');
  if (cnt) cnt.textContent = _selDiscs.length + ' seleccionado(s)';
}

function paso1() {
  var nombre = document.getElementById('c-nombre').value.trim();
  var circuito = document.getElementById('c-circuito').value.trim();
  var ciudad = document.getElementById('c-ciudad').value.trim();
  var dir = document.getElementById('c-dir').value.trim();
  var dia = document.getElementById('c-dia').value;
  var horario = document.getElementById('c-horario').value.trim();
  if (!nombre || !circuito || !ciudad || !dir || !dia || !horario) { obErr('Todos los campos son obligatorios'); return; }
  _datosCong = { nombre:nombre, circuito:circuito, ciudad:ciudad, direccion:dir, dia:dia, horario:horario };
  obErr('');
  _step++;
  renderStep();
}

function paso2() {
  var nombre = document.getElementById('u-nombre').value.trim();
  var tel = document.getElementById('u-tel').value.trim();
  var nom = document.getElementById('u-nom').value;
  var pass = document.getElementById('u-pass').value;
  var pass2 = document.getElementById('u-pass2').value;
  if (!nombre || !tel || !nom) { obErr('Todos los campos son obligatorios'); return; }
  if (pass.length < 8) { obErr('La contrasena debe tener al menos 8 caracteres'); return; }
  if (pass !== pass2) { obErr('Las contrasenas no coinciden'); return; }
  _datosUsr = { nombre:nombre, telefono:tel, nombramiento:nom, password:pass };
  obErr('');
  if (_discursos.length > 0) { _step++; renderStep(); }
  else finalizar();
}

async function finalizar() {
  var btn = document.querySelector('.ob-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Activando cuenta...'; }
  obErr('');
  try {
    var authRes = await _sb.auth.signUp({
      email: _inv.email,
      password: _datosUsr.password,
      options: { data: { nombre: _datosUsr.nombre } }
    });
    if (authRes.error) throw new Error(authRes.error.message);
    var userId = authRes.data.user.id;

    if (_esCongNueva && _datosCong) {
      await _sb.from('congregaciones').update({
        nombre: _datosCong.nombre, circuito: _datosCong.circuito,
        ciudad: _datosCong.ciudad, direccion: _datosCong.direccion,
        dia: _datosCong.dia, horario: _datosCong.horario
      }).eq('id', _inv.cong_id);
    }

    await _sb.from('usuarios').upsert({
      id: userId, email: _inv.email, nombre: _datosUsr.nombre,
      rol: _inv.rol || 'lector', cong_id: _inv.cong_id, activo: true
    }, { onConflict: 'email' });

    var hermId = 'h' + Date.now();
    await _sb.from('hermanos').insert({
      id: hermId, cong_id: _inv.cong_id, nombre: _datosUsr.nombre,
      nombramiento: _datosUsr.nombramiento, telefono: _datosUsr.telefono,
      puede_afuera: 'si', puede_local: 'si', estado: 'Activo'
    });

    if (_selDiscs.length > 0) {
      var reps = _selDiscs.map(function(num) {
        var disc = _discursos.find(function(d) { return d.numero === num; });
        return {
          id: 'r' + Date.now() + num, cong_id: _inv.cong_id,
          hermano_id: hermId, num_discurso: num,
          titulo: disc ? disc.titulo : '',
          puede_afuera: 'si', puede_local: 'si', estado: 'Activo'
        };
      });
      await _sb.from('repertorio').insert(reps);
    }

    await _sb.from('invitaciones').update({
      usada: true, usada_en: new Date().toISOString(), usada_por: _inv.email
    }).eq('token', _token);

    document.getElementById('ob-wrap').innerHTML =
      '<div class="ob-success">'
      + '<div class="icon">&#127881;</div>'
      + '<h2>Cuenta activada</h2>'
      + '<p>Tu cuenta ha sido creada exitosamente.<br>Ya puedes ingresar al Coordinador de Discursos.</p>'
      + '<button class="ob-btn" style="max-width:260px;margin:0 auto;display:block" onclick="window.location.href=\'index.html\'">Ir al inicio de sesion</button>'
      + '</div>';

  } catch(e) {
    obErr('Error: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Activar mi cuenta'; }
  }
}

init();
</script>
</body>
</html>
