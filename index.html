<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coordinador de Discursos Publicos</title>
<link rel="stylesheet" href="css/styles.css">
<style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--sidebar-bg);}</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">&#128218;</div>
  <div class="login-title">Coordinador de Discursos</div>
  <div class="login-sub">Accede con tu email y contrasena</div>
  <input class="login-field" id="login-email" type="email" placeholder="tu@email.com" autocomplete="email">
  <input class="login-field" id="login-pass" type="password" placeholder="Contrasena" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="login-btn-main" id="login-btn" onclick="doLogin()">Ingresar</button>
  <span class="login-forgot" onclick="doResetPassword()">Olvide mi contrasena</span>
  <div class="login-err" id="login-err"></div>
  <div style="font-size:11px;color:rgba(255,255,255,.2);margin-top:20px">v4.0</div>
</div>
<div id="tc"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/app.js"></script>
<script>
_sb.auth.onAuthStateChange(function(event,session){
  if(!session)return;
  _sb.from("usuarios").select("*").eq("email",session.user.email).maybeSingle().then(function(res){
    if(res.data&&res.data.activo){ window.location.href="app.html"; }
    else{ loginErr("No tienes acceso. Contacta al administrador."); _sb.auth.signOut(); }
  });
});
</script>
</body>
</html>
